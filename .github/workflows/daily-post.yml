name: Daily Instagram post
concurrency: daily-post
on:
  schedule:
    - cron: "*/15 * * * *"  # checks every 15 minutes; posts once a day at the time set on the approval board
  workflow_dispatch: {}      # "Run workflow" button for a manual test
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: post
        run: python post_next.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Record what was posted
        if: always()
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add -A posted.json last_error.json 2>/dev/null || git add -A posted.json
          git diff --cached --quiet && exit 0
          git commit -m "Posting record $(date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
